# بيانات النشر على Render - Blueprint (نشر متكامل: التطبيق + قاعدة PostgreSQL)
# الضغط على الرابط أدناه ينشئ كل شيء تلقائياً

databases:
  - name: north-darfur-db
    plan: free
    databaseName: north_darfur
    user: ndr_admin

services:
  - type: web
    name: north-darfur-erp
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: ADMIN_EMAIL
        value: admin@ndr.org
      - key: ADMIN_PASSWORD
        value: Admin@5523
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: north-darfur-db
          property: connectionString
